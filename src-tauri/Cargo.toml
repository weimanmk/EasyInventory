[package]
name = "easyinventory"
version = "1.2.0"
description = "本地库存计价打单软件"
authors = ["EasyInventory"]
edition = "2021"

[lib]
name = "easyinventory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
anyhow = "1.0"
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
open = "5.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.0", features = [] }
thiserror = "2.0"
umya-spreadsheet = "2.2"

[dev-dependencies]
tempfile = "3.14"
